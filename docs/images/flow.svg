<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <marker id="arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <style>
    .skill { fill:#eef3fb; stroke:#3b6fb6; stroke-width:1.5; }
    .gate  { fill:#fff4e5; stroke:#d98b1a; stroke-width:1.5; }
    .agent { fill:#f4f4f4; stroke:#888; stroke-width:1.2; stroke-dasharray:4 3; }
    .prep  { fill:#f7f7f7; stroke:#aaa; stroke-width:1.2; stroke-dasharray:4 3; }
    .t  { fill:#222; }
    .s  { fill:#555; font-size:11px; }
    .h  { font-weight:bold; font-size:14px; }
    .ln { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .ld { stroke:#888; stroke-width:1.2; fill:none; stroke-dasharray:4 3; marker-end:url(#arrow-d); marker-start:url(#arrow-d); }
    .ld1{ stroke:#888; stroke-width:1.2; fill:none; stroke-dasharray:4 3; marker-end:url(#arrow-d); }
  </style>

  <!-- 준비 단계 -->
  <rect class="prep" x="30" y="20" width="150" height="50" rx="6"/>
  <text class="t h" x="105" y="40" text-anchor="middle">0 survey (선택)</text>
  <text class="s" x="105" y="58" text-anchor="middle">docs/agent 문서 생성</text>
  <path class="ld1" d="M105,70 L105,128"/>
  <text class="s" x="112" y="104">gotchas·overview·commands</text>

  <!-- 1 draft -->
  <rect class="skill" x="30" y="130" width="150" height="80" rx="6"/>
  <text class="t h" x="105" y="155" text-anchor="middle">1 draft</text>
  <text class="s" x="105" y="176" text-anchor="middle">파악 · 질문 · Spec · 계획</text>
  <text class="s" x="105" y="196" text-anchor="middle">단계: 계획</text>

  <path class="ln" d="M180,170 L200,170"/>

  <!-- 게이트1 -->
  <rect class="gate" x="200" y="140" width="140" height="60" rx="30"/>
  <text class="t h" x="270" y="160" text-anchor="middle">게이트1</text>
  <text class="s" x="270" y="176" text-anchor="middle">사람이 읽고</text>
  <text class="s" x="270" y="190" text-anchor="middle">/baton:implement 호출</text>

  <path class="ln" d="M340,170 L360,170"/>

  <!-- 2 implement -->
  <rect class="skill" x="360" y="130" width="150" height="80" rx="6"/>
  <text class="t h" x="435" y="155" text-anchor="middle">2 implement</text>
  <text class="s" x="435" y="176" text-anchor="middle">Task 구현 · Verify · 빌드</text>
  <text class="s" x="435" y="196" text-anchor="middle">단계: 구현</text>

  <path class="ln" d="M510,170 L530,170"/>
  <text class="s" x="520" y="124" text-anchor="middle">자동 호출</text>

  <!-- 3 inspect -->
  <rect class="skill" x="530" y="130" width="150" height="80" rx="6"/>
  <text class="t h" x="605" y="155" text-anchor="middle">3 inspect</text>
  <text class="s" x="605" y="176" text-anchor="middle">fresh 리뷰 → 블로커 수정</text>
  <text class="s" x="605" y="196" text-anchor="middle">단계: 리뷰 → 승인대기</text>

  <path class="ln" d="M680,170 L700,170"/>

  <!-- 게이트2 -->
  <rect class="gate" x="700" y="140" width="140" height="60" rx="30"/>
  <text class="t h" x="770" y="160" text-anchor="middle">게이트2</text>
  <text class="s" x="770" y="176" text-anchor="middle">사람이 테스트하고</text>
  <text class="s" x="770" y="190" text-anchor="middle">/baton:signoff 호출</text>

  <path class="ln" d="M840,170 L860,170"/>

  <!-- 4 signoff -->
  <rect class="skill" x="860" y="130" width="150" height="80" rx="6"/>
  <text class="t h" x="935" y="155" text-anchor="middle">4 signoff</text>
  <text class="s" x="935" y="176" text-anchor="middle">테스트 결과 · 작업 이력</text>
  <text class="s" x="935" y="196" text-anchor="middle">단계: 완료 → done/</text>

  <!-- 에이전트 -->
  <path class="ld" d="M105,212 L105,268"/>
  <rect class="agent" x="30" y="270" width="150" height="66" rx="6"/>
  <text class="t h" x="105" y="291" text-anchor="middle">doubter (fresh)</text>
  <text class="s" x="105" y="309" text-anchor="middle">Spec·계획 반증</text>
  <text class="s" x="105" y="325" text-anchor="middle">정규 규모만</text>

  <path class="ld" d="M435,212 L435,268"/>
  <rect class="agent" x="360" y="270" width="150" height="66" rx="6"/>
  <text class="t h" x="435" y="291" text-anchor="middle">coder</text>
  <text class="s" x="435" y="309" text-anchor="middle">Task 단위 구현</text>
  <text class="s" x="435" y="325" text-anchor="middle">파일 수 두 자릿수일 때만</text>

  <path class="ld" d="M605,212 L605,268"/>
  <rect class="agent" x="530" y="270" width="150" height="66" rx="6"/>
  <text class="t h" x="605" y="291" text-anchor="middle">reviewer (fresh)</text>
  <text class="s" x="605" y="309" text-anchor="middle">diff + AC만 받아 리뷰</text>
  <text class="s" x="605" y="325" text-anchor="middle">6각도 · 정적 판단</text>

  <!-- 범례 -->
  <rect class="skill" x="30" y="366" width="18" height="14" rx="3"/>
  <text class="s" x="54" y="377">스킬: 사람이 부른다 (inspect만 implement가 자동으로 부른다)</text>
  <rect class="gate" x="430" y="366" width="18" height="14" rx="7"/>
  <text class="s" x="454" y="377">게이트: 사람의 호출로만 닫힌다</text>
  <rect class="agent" x="700" y="366" width="18" height="14" rx="3"/>
  <text class="s" x="724" y="377">에이전트: 스킬이 부른다. 대화를 못 본 fresh</text>
</svg>
