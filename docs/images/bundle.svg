<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#ffffff; stroke:#666; stroke-width:1.3; }
    .doc   { fill:#eef3fb; stroke:#3b6fb6; stroke-width:1.5; }
    .later { fill:#f7f7f7; stroke:#999; stroke-width:1.2; stroke-dasharray:4 3; }
    .t  { fill:#222; }
    .s  { fill:#555; font-size:11.5px; }
    .m  { font-family:Consolas,'D2Coding',monospace; font-size:11.5px; fill:#222; }
    .h  { font-weight:bold; font-size:13.5px; }
    .ln { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
  </style>

  <!-- 윗줄: 요청 → 분할안 → 묶음 문서 -->
  <rect class="box" x="30" y="30" width="120" height="40" rx="5"/>
  <text class="t" x="90" y="55" text-anchor="middle">큰 요청</text>
  <path class="ln" d="M150,50 L180,50"/>

  <rect class="box" x="180" y="30" width="330" height="40" rx="5"/>
  <text class="t" x="345" y="48" text-anchor="middle">분할안 표를 보이고 사람이 고른다</text>
  <text class="s" x="345" y="63" text-anchor="middle"># | slug | 끝나면 되는 것 | 선행  (이대로 / 한 문서로 / 수정)</text>
  <path class="ln" d="M510,50 L540,50"/>

  <rect class="doc" x="540" y="14" width="250" height="90" rx="5"/>
  <text class="t h" x="555" y="34">{묶음}.bundle.md</text>
  <text class="m" x="555" y="54">- [ ] 1. 작업A · 선행: 없음</text>
  <text class="m" x="555" y="71">- [ ] 2. 작업B · 선행: 1</text>
  <text class="m" x="555" y="88">- [ ] 3. 작업C · 선행: 1</text>

  <text class="s" x="810" y="45">+ 공통 전제</text>
  <text class="s" x="810" y="62">+ 넘겨받은 요구</text>
  <text class="s" x="810" y="79">(AC·Task는 안 적는다)</text>

  <!-- 아랫줄: 시간 순 -->
  <text class="s" x="30" y="140">시간 →</text>

  <rect class="doc" x="30" y="150" width="280" height="72" rx="5"/>
  <text class="t h" x="45" y="171">작업A.md  (지금 만든다)</text>
  <text class="s" x="45" y="191">draft → 게이트1 → implement →</text>
  <text class="s" x="45" y="208">inspect → 게이트2 → signoff</text>

  <path class="ln" d="M310,186 L360,186"/>
  <text class="s" x="335" y="176" text-anchor="middle">[x]</text>

  <rect class="later" x="360" y="150" width="280" height="72" rx="5"/>
  <text class="t h" x="375" y="171">작업B.md  (A가 끝난 뒤 만든다)</text>
  <text class="s" x="375" y="191">/baton:draft 작업B</text>
  <text class="s" x="375" y="208">→ 그때의 코드로 파악 → 같은 체인</text>

  <path class="ln" d="M640,186 L690,186"/>
  <text class="s" x="665" y="176" text-anchor="middle">[x]</text>

  <rect class="later" x="690" y="150" width="280" height="72" rx="5"/>
  <text class="t h" x="705" y="171">작업C.md  (A가 끝난 뒤 만든다)</text>
  <text class="s" x="705" y="191">선행이 1뿐이라</text>
  <text class="s" x="705" y="208">B와 순서는 사람이 고른다</text>

  <text class="s" x="30" y="262">지금 만드는 것은 묶음 문서와 첫 작업 문서뿐이다. 뒤 작업의 문서는 앞 작업이 끝난 뒤의 코드를 보고 쓴다.</text>
  <text class="s" x="30" y="282">작업마다 게이트1·게이트2를 따로 지나고 따로 커밋한다. signoff가 묶음 문서의 줄을 [x]로 바꾸고 다음에 부를 수 있는 작업을 안내한다.</text>
  <text class="s" x="30" y="302">작업 추가·취소·선행 변경은 /baton:draft {묶음 이름} … 으로 묶음 문서의 [ ] 줄만 고친다.</text>
</svg>
