<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="13">
  <style>
    .bad  { fill:#fbeeee; stroke:#c0504d; stroke-width:1.3; }
    .good { fill:#eef7ee; stroke:#4e9a51; stroke-width:1.3; }
    .cell { fill:#ffffff; stroke:#999; stroke-width:1; }
    .t  { fill:#222; }
    .s  { fill:#555; font-size:11px; }
    .h  { font-weight:bold; font-size:14px; }
    .no { fill:#c0504d; font-size:11px; }
    .ok { fill:#2e7d32; font-size:11px; }
  </style>

  <!-- 왼쪽: 수평 -->
  <text class="t h" x="30" y="28">층별로 나누면 (수평): 피한다</text>

  <rect class="bad" x="30" y="50" width="300" height="40" rx="5"/>
  <text class="t" x="45" y="75">Task 1: DB 컬럼 추가</text>
  <text class="no" x="345" y="75">AC 하나도 잴 수 없음</text>

  <rect class="bad" x="30" y="100" width="300" height="40" rx="5"/>
  <text class="t" x="45" y="125">Task 2: API 수정</text>
  <text class="no" x="345" y="125">AC 하나도 잴 수 없음</text>

  <rect class="bad" x="30" y="150" width="300" height="40" rx="5"/>
  <text class="t" x="45" y="175">Task 3: 화면 수정</text>
  <text class="no" x="345" y="175">여기서야 AC 1·2 전부</text>

  <text class="s" x="30" y="225">Task 2까지 끝나고 멈추면 컬럼만 있고 쓰는 곳이 없다.</text>
  <text class="s" x="30" y="243">마지막 Task 전까지 "맞게 가고 있나"를 아무도 모른다.</text>

  <!-- 가운데 구분선 -->
  <line x1="470" y1="20" x2="470" y2="300" stroke="#ccc" stroke-dasharray="4 4"/>

  <!-- 오른쪽: 수직 -->
  <text class="t h" x="500" y="28">AC 단위로 나누면 (수직): baton의 규칙</text>

  <!-- Task 1 열 -->
  <rect class="good" x="500" y="50" width="180" height="200" rx="5"/>
  <text class="t h" x="590" y="72" text-anchor="middle">Task 1 = AC 1</text>
  <text class="s" x="590" y="88" text-anchor="middle">"준비 취소가 저장된다"</text>
  <rect class="cell" x="515" y="100" width="150" height="30" rx="3"/>
  <text class="t" x="590" y="120" text-anchor="middle">DB</text>
  <rect class="cell" x="515" y="138" width="150" height="30" rx="3"/>
  <text class="t" x="590" y="158" text-anchor="middle">API</text>
  <rect class="cell" x="515" y="176" width="150" height="30" rx="3"/>
  <text class="t" x="590" y="196" text-anchor="middle">화면</text>
  <text class="ok" x="590" y="232" text-anchor="middle">Verify가 AC 1을 잰다</text>

  <!-- Task 2 열 -->
  <rect class="good" x="700" y="50" width="180" height="200" rx="5"/>
  <text class="t h" x="790" y="72" text-anchor="middle">Task 2 = AC 2</text>
  <text class="s" x="790" y="88" text-anchor="middle">"취소 사유가 보인다"</text>
  <rect class="cell" x="715" y="100" width="150" height="30" rx="3"/>
  <text class="t" x="790" y="120" text-anchor="middle">DB</text>
  <rect class="cell" x="715" y="138" width="150" height="30" rx="3"/>
  <text class="t" x="790" y="158" text-anchor="middle">API</text>
  <rect class="cell" x="715" y="176" width="150" height="30" rx="3"/>
  <text class="t" x="790" y="196" text-anchor="middle">화면</text>
  <text class="ok" x="790" y="232" text-anchor="middle">Verify가 AC 2를 잰다</text>

  <text class="s" x="500" y="278">Task 1만 끝나도 AC 1은 끝까지 동작한다.</text>
  <text class="s" x="500" y="296">중간에 끊겨도 깨진 채 남지 않고, Task마다 "맞게 가고 있나"를 잰다.</text>
</svg>
